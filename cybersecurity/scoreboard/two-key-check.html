<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Two-Key Rite Code Check</title><style>
:root{--bg:#17112B;--panel:#183446;--text:#F4F7F8;--mut:#B6C7D1;--ok:#2FBF71;--bad:#E5484D;--gold:#D4A843}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif;min-height:100vh;padding:16px}
main{max-width:640px;margin:0 auto}h1{font-size:clamp(22px,4vw,32px);margin:0 0 6px}.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:700;margin-bottom:6px}
select,input{width:100%;font-size:22px;padding:12px;border-radius:8px;border:2px solid #2B4B60;background:#0F1F2B;color:var(--text);margin-bottom:14px}
input{font-family:Consolas,monospace;letter-spacing:.2em;text-align:center}
button{font-size:20px;font-weight:800;padding:14px 18px;border-radius:8px;border:0;background:var(--gold);color:#17112B;cursor:pointer;width:100%;min-height:52px}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
#res{font-size:22px;font-weight:800;padding:14px;border-radius:10px;border:3px solid var(--mut);margin-top:14px}
#res.ok{border-color:var(--ok)}#res.bad{border-color:var(--bad)}#res small{display:block;font-weight:400;font-size:16px;color:var(--mut);margin-top:4px}
#tm{color:var(--mut);margin-top:10px}a{color:var(--gold)}
</style></head><body><main>
<h1>Two-Key Rite: check a code</h1>
<p class="sub">Scorekeepers only. Pick the lodge, type the 6 digits from the Warden's authenticator app, and see if it matches. Practice codes for the class QR cards only.</p>
<div class="card"><form id="f" autocomplete="off">
<label for="lodge">Lodge</label>
<select id="lodge"><option value="0">Lodge 1</option><option value="1">Lodge 2</option><option value="2">Lodge 3</option><option value="3">Lodge 4</option><option value="4">Lodge 5</option><option value="5">Lodge 6</option><option value="6">Spare</option></select>
<label for="code">6-digit code</label>
<input id="code" inputmode="numeric" maxlength="7" pattern="[0-9 ]*" placeholder="000 000">
<button type="submit">Check code</button>
<div id="res" role="status" aria-live="polite" hidden></div>
<div id="tm"></div></form></div>
<p><a href="/counselor/tools/two-key-rite-display.html">Open the code display</a> · <a href="/cybersecurity/scoreboard/edit.html">Back to scorekeeper</a></p>
<script>
const SECS=["3YOM4E2XJIDV4YEW", "F6CDGCQ26N7CBUOY", "5RUOI55DXSOHUKUT", "ZXRZDCHFJYDTWYOL", "RYFLAN32XS6OAH5X", "O5MPNVMAOPDKK6XN", "344DP4PNMBPJVTLU"];
const NAMES=["Lodge 1","Lodge 2","Lodge 3","Lodge 4","Lodge 5","Lodge 6","Spare"];
function b32(s){const a='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='';for(const ch of s)bits+=a.indexOf(ch).toString(2).padStart(5,'0');const out=[];for(let i=0;i+8<=bits.length;i+=8)out.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(out)}
async function code(sec,counter){const key=await crypto.subtle.importKey('raw',b32(sec),{name:'HMAC',hash:'SHA-1'},false,['sign']);
 const buf=new ArrayBuffer(8);const dv=new DataView(buf);dv.setUint32(0,Math.floor(counter/4294967296));dv.setUint32(4,counter>>>0);
 const h=new Uint8Array(await crypto.subtle.sign('HMAC',key,buf));const o=h[19]&15;const n=((h[o]&0x7f)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1000000;return String(n).padStart(6,'0')}
const now=()=>window.__NOW?window.__NOW:Date.now();
// Accept the current 30-second window, the one just before (a Warden who read it a moment late),
// and the one just after (a phone clock a little fast).
const OFFSETS=[[0,"the current code"],[-1,"the previous code, from a few seconds ago"],[1,"the next code (the phone clock may be a little fast)"]];
async function matches(i,entered,c){for(const [d,label] of OFFSETS){if(await code(SECS[i],c+d)===entered)return label}return null}
const res=document.getElementById('res');
function show(cls,text,detail){res.hidden=false;res.className=cls;res.textContent=text;if(detail){const s=document.createElement('small');s.textContent=detail;res.appendChild(s)}}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();
 const entered=document.getElementById('code').value.replace(/\s+/g,'');
 if(!/^\d{6}$/.test(entered)){show('bad','Enter all 6 digits.');return}
 const i=+document.getElementById('lodge').value,c=Math.floor(now()/30000);
 const hit=await matches(i,entered,c);
 if(hit){show('ok','✔ Valid for '+NAMES[i],'Matches '+hit+'.');return}
 for(let j=0;j<SECS.length;j++){if(j!==i&&await matches(j,entered,c)){show('bad','✖ Not '+NAMES[i]+"'s code",'That code belongs to '+NAMES[j]+'.');return}}
 show('bad','✖ Not valid','No lodge has that code right now. Ask the Warden to read the newest 6 digits.')});
function tick(){const left=30-((now()/1000)%30);document.getElementById('tm').textContent='Codes change in '+Math.ceil(left)+' s'}
setInterval(tick,500);tick();
</script></main></body></html>
