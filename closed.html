<main id="main">
<section class="band"><div class="wrap">
  <p class="crumb">Merit Badge Field Kit</p>
  <h1 id="h">This class is not open right now</h1>
  <p class="lead" id="why">Ask your counselor when it opens.</p>
  <p><a class="btn" href="index.html">Back to the home page</a></p>
</div></section>
</main>
<footer class="foot"><p>An unofficial unit resource for Scouts and merit badge counselors. Not affiliated with or endorsed by Scouting America.</p></footer>
<script src="assets/schedule.js"></script>
<script>
(function(){
 var S=window.MBSchedule,k=(new URLSearchParams(location.search).get("badge")||"").slice(0,2),name=S.NAMES[k];
 if(name)document.getElementById("h").textContent=name+" is not open right now";
 S.load().then(function(r){
  var c=r.badges[k];if(!c)return;var st=S.status(c,Date.now()+r.skew),w=document.getElementById("why");
  if(st.open){location.replace("index.html");return}
  w.textContent=st.reason==="before"?"It opens "+S.when(st.opensAt)+". Class is "+S.label(c)+".":st.reason==="after"?"This class has finished. Thanks for coming!":"Your counselor has not opened this class yet. Ask when it starts.";
 });
})();
</script>
<script src="assets/app.js" defer></script>
